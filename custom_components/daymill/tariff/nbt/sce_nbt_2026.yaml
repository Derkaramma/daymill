# Unofficial. Numbers copied from SCE's published NBT export price tables.
# Check sce.com before relying on any estimate.
#
# SCE Net Billing Tariff (Solar Billing Plan) export credit prices, vintage NBT26.
#
# Applies to systems whose Original Permission to Operate (PTO) date falls in
# calendar year 2026. Prices are locked for 9 years from the PTO date, but the
# locked schedule still changes each calendar year: "prices" is calendar year
# 2026 and "prices_by_year" holds the later lock-in years.
#
# Each value is the total Energy Export Credit (EEC) price in $/kWh: the
# Delivery component plus the SCE Generation component, as published by SCE.
# Hour index is the hour start (0 = 00:00-00:59) in Pacific prevailing time.
# "weekend" covers Saturdays, Sundays and SCE TOU holidays (same holiday list
# as TOU-D, with Sunday holidays observed on Monday).
#
# Not included here: the ACC Plus adder (see acc_plus_adder), which is a
# separate per-kWh export credit. CCA and Direct Access customers get only
# the Delivery part from SCE, so these totals do not apply to them.

utility: SCE
name: SCE Solar Billing Plan (NBT) export credits, NBT26 (unofficial)
vintage: NBT26
vintage_year: 2026
# PTO years whose export prices match this file for every year it covers.
price_vintages: [2025, 2026]
effective_date: 2026-01-01
price_year: 2026
lock_in_years: 9
units: USD/kWh
timezone: America/Los_Angeles
source_urls:
  - https://www.sce.com/customer-service-center/help-center/solar/solar-billing-plan/understanding-export-pricing
  - https://www.sce.com/sites/default/files/custom-files/PDF_Files/ELECTRIC_SCHEDULES_NBT.pdf
  - https://www.sce.com/customer-service-center/help-center/solar/solar-billing-plan/solar-billing-plan-faqs
notes: >-
  Verified against SCE's published Energy Export Credit price files
  ("EEC Factors Upload File - Pacific Time Zone", sheet "PTO Grp 4 (2026)",
  and the NBT26 MIDAS file). Both files agree on every hour. Totals are
  Delivery EEC plus SCE Generation EEC, rounded to 5 decimals. Credits are
  computed per hour from metered export kWh. Export credits can only offset
  energy charges, never non-bypassable charges or fixed charges. The ACC Plus
  adder is credited on top of these prices for residential customers.
acc_plus_adder:
  residential: 0.016
  residential_equity: 0.037
# ACC Plus by PTO year (Schedule NBT, Rates 3.b). Fixed for the lock-in, then 0.
# The last row holds for every later PTO year.
